name: lightfm_env
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.9
  - numpy>=1.23,<1.26
  - scipy>=1.8,<1.11
  - pandas=2.1
  - lightfm=1.17
  - tqdm=4.66.1
  - pymysql=1.1.1
  - pip
  - pip:
      - fastapi==0.103.0
      - uvicorn==0.23.0
      - mlflow==2.6.0
      - cython
      - haversine
      - python-dotenv