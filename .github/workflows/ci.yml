name: CI - Tests & Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev_beta]


jobs:
  test_ingestion:
    name: Tests Ingestion
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Installer les dépendances Python
        working-directory: ingestion
        run: |
            python3 -m venv venv
            source venv/bin/activate 
            pip install -r requirements.txt
      - name: Run les tests
        working-directory: ingestion
        run: |
          pytest tests/ -v

  test-api:
    name: Tests API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Installer Miniconda
      - name: Installer Miniconda
        run: |
          wget https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -O miniconda.sh
          bash miniconda.sh -b -p $HOME/miniconda
          echo "$HOME/miniconda/bin" >> $GITHUB_PATH

      # Créer l'environnement Conda
      - name: Configurer Conda et installer les dépendances
        run: |
          conda create -y -n lightfm_env python=3.9
          conda install -y -n lightfm_env -c conda-forge \
            lightfm \
            numpy \
            scipy \
            tqdm \
            pymysql \
            pandas \
            scikit-learn

      # Installer les dépendances Python via pip
      - name: Installer les dépendances Python
        run: |
          conda run -n lightfm_env pip install \
            fastapi \
            uvicorn \
            pymysql \
            pandas \
            numpy \
            httpx==0.25.0 \
            python-dotenv \
            pytest \
            haversine \
            prometheus-fastapi-instrumentator

      # Lancer les tests avec la fake DB SQLite
      - name: Lancer les tests API
        working-directory: back
        run: |
          conda run -n lightfm_env pytest tests/ -v


  test-front:
    name: Tests Front
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: front

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false


  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest

    needs:
      - test-api
      - test-front
      - test_ingestion

    strategy:
      matrix:
        include:
          - service: model
            dockerfile: docker/Dockerfile.model
          - service: api
            dockerfile: docker/Dockerfile.api
          - service: front
            dockerfile: docker/Dockerfile.front

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.service }}:test