name: CI - Tests & Build

on:
  pull_request:
    branches: [main, develop]
  push:
    branches:
      - '*'

jobs:
  test-api:
    name: Tests API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Installer Miniconda
      - name: Installer Miniconda
        run: |
          wget https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -O miniconda.sh
          bash miniconda.sh -b -p $HOME/miniconda
          echo "$HOME/miniconda/bin" >> $GITHUB_PATH

      # Configurer l'environnement Conda
      - name: Configurer Conda
        run: |
          conda update -y conda
          conda create -y -n lightfm_env python=3.10
          conda init bash
          echo "conda activate lightfm_env" >> $GITHUB_ENV

      # Installer lightfm via Conda
      - name: Installer lightfm
        run: |
          source $HOME/miniconda/bin/activate lightfm_env
          conda install -y -c conda-forge lightfm

      # Installer les autres dépendances via pip
      - name: Installer les dépendances Python
        run: |
          source $HOME/miniconda/bin/activate lightfm_env
          pip install fastapi uvicorn pymysql pandas numpy httpx==0.25.0 python-dotenv pytest

      # Lancer les tests
      - name: Lancer les tests
        run: |
          source $HOME/miniconda/bin/activate lightfm_env
          pytest tests/ -v
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DB: ${{ secrets.MYSQL_DB }}

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test-api

    strategy:
      matrix:
        include:
          - service: model
            dockerfile: docker/Dockerfile.model
          - service: api
            dockerfile: docker/Dockerfile.api
          - service: front
            dockerfile: docker/Dockerfile.front

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.service }}:test